<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio de Ingeniería de Datos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Prism.js para resaltar sintaxis -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
          Repositorio de Proyectos
        </h1>
        <p class="text-xs text-slate-400">Ingeniería en Datos & Inteligencia Organizacional</p>
      </div>
      <div id="status-badge" class="text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">
        Conectando...
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="max-w-6xl mx-auto px-6 py-10">
    <section>
      <h2 class="text-xl font-semibold mb-6 flex items-center gap-2">
        <span>📚</span> Biblioteca de Trabajos
      </h2>
      <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Renderizado dinámico -->
      </div>
    </section>

    <!-- Modal Detalle del Proyecto -->
    <div id="project-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden overflow-y-auto p-4 md:p-8">
      <div class="max-w-4xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl relative">
        <button id="close-modal-btn" class="absolute top-6 right-6 text-slate-400 hover:text-white text-2xl font-bold">
          &times;
        </button>
        <div id="modal-content">
          <!-- Inyección dinámica -->
        </div>
      </div>
    </div>
  </main>

  <!-- SCRIPT CON ES MODULES DIRECTOS -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // ==========================================
    // ⚙️ CONFIGURACIÓN DEL ALUMNO
    // ==========================================
    const SUPABASE_URL = "https://zxfewnktqllujxkevdno.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_RtYUEOkqDZP3XfU4itqnMQ_ny4ucrCf"; // <-- Tu anon public key

    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let allProjects = [];

    async function loadProjects() {
      const badge = document.getElementById('status-badge');
      try {
        const { data, error } = await db
          .from('projects')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        allProjects = data || [];
        renderProjects(allProjects);

        badge.textContent = `En línea (${allProjects.length} proyectos)`;
        badge.className = "text-xs px-3 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800";
      } catch (err) {
        console.error("Error al cargar proyectos:", err);
        badge.textContent = "Error al conectar";
        badge.className = "text-xs px-3 py-1 rounded-full bg-red-950 text-red-400 border border-red-800";
      }
    }

    function renderProjects(projects) {
      const grid = document.getElementById('projects-grid');
      if (projects.length === 0) {
        grid.innerHTML = `<p class="text-slate-400 col-span-3">No hay proyectos registrados en la tabla aún.</p>`;
        return;
      }

      grid.innerHTML = projects.map(p => {
        const tagsHtml = (p.tags || [])
          .map(tag => `<span class="text-[10px] uppercase font-semibold px-2 py-0.5 rounded bg-slate-800 text-cyan-400 border border-slate-700">${escapeHtml(tag)}</span>`)
          .join('');

        return `
          <div class="bg-slate-900 border border-slate-800 hover:border-cyan-500/50 transition-all rounded-xl p-6 flex flex-col justify-between cursor-pointer group shadow-lg" data-project-id="${p.id}">
            <div>
              <div class="flex flex-wrap gap-1.5 mb-3">${tagsHtml}</div>
              <h3 class="text-lg font-bold group-hover:text-cyan-400 transition-colors mb-2">${escapeHtml(p.title)}</h3>
              <p class="text-slate-400 text-sm line-clamp-3 mb-4">${escapeHtml(p.summary || '')}</p>
            </div>
            <div class="text-xs text-cyan-400 font-medium flex items-center gap-1 mt-2">
              Ver detalles, código y datos &rarr;
            </div>
          </div>
        `;
      }).join('');

      // Event listener para las tarjetas
      grid.querySelectorAll('[data-project-id]').forEach(card => {
        card.addEventListener('click', () => {
          const id = Number(card.getAttribute('data-project-id'));
          openModal(id);
        });
      });
    }

    function openModal(id) {
      const p = allProjects.find(item => item.id === id);
      if (!p) return;

      const tagsHtml = (p.tags || [])
        .map(t => `<span class="text-xs font-semibold px-2.5 py-1 rounded bg-slate-800 text-cyan-400">${escapeHtml(t)}</span>`)
        .join('');

      let chartsHtml = '';
      if (p.charts_urls && p.charts_urls.length > 0) {
        const imagesList = p.charts_urls
          .map(url => `
            <div class="rounded-lg overflow-hidden border border-slate-800 bg-slate-950">
              <img src="${url}" alt="Gráfica" class="w-full h-auto object-cover max-h-64 hover:scale-105 transition-transform" />
            </div>
          `).join('');

        chartsHtml = `
          <div>
            <h4 class="text-sm font-semibold text-slate-300 mb-3">📊 Gráficos y Visualizaciones</h4>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${imagesList}</div>
          </div>
        `;
      }

      let codeHtml = '';
      if (p.code_snippet) {
        codeHtml = `
          <div>
            <h4 class="text-sm font-semibold text-slate-300 mb-2">💻 Código Fuente / Transformación</h4>
            <pre class="rounded-xl overflow-x-auto text-xs !bg-slate-950 !border !border-slate-800"><code class="language-${p.code_language || 'python'}">${escapeHtml(p.code_snippet)}</code></pre>
          </div>
        `;
      }

      let datasetHtml = '';
      if (p.dataset_url) {
        datasetHtml = `
          <div class="pt-4 border-t border-slate-800 flex justify-between items-center">
            <span class="text-xs text-slate-400">Dataset utilizado:</span>
            <a href="${p.dataset_url}" target="_blank" download class="inline-flex items-center gap-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors">
              <span>📥</span> Descargar Dataset
            </a>
          </div>
        `;
      }

      const modalContent = document.getElementById('modal-content');
      modalContent.innerHTML = `
        <div class="space-y-6">
          <div>
            <div class="flex flex-wrap gap-2 mb-2">${tagsHtml}</div>
            <h2 class="text-2xl font-bold text-white mb-2">${escapeHtml(p.title)}</h2>
            <p class="text-slate-400 text-sm">${escapeHtml(p.summary || '')}</p>
          </div>

          <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-xl">
            <h4 class="text-cyan-400 font-semibold text-sm mb-1 uppercase tracking-wide">💡 Conclusiones del Trabajo</h4>
            <p class="text-slate-200 text-sm leading-relaxed whitespace-pre-line">${escapeHtml(p.conclusions || '')}</p>
          </div>

          ${chartsHtml}
          ${codeHtml}
          ${datasetHtml}
        </div>
      `;

      document.getElementById('project-modal').classList.remove('hidden');
      if (window.Prism) Prism.highlightAll();
    }

    function closeModal() {
      document.getElementById('project-modal').classList.add('hidden');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.getElementById('close-modal-btn').addEventListener('click', closeModal);
    window.addEventListener('click', (e) => {
      const modal = document.getElementById('project-modal');
      if (e.target === modal) closeModal();
    });

    loadProjects();
  </script>
</body>
</html>
